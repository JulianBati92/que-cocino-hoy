name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://example.com
      # Syntactically valid placeholder used only while prerendering in CI.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyD000000000000000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: portfolio-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: portfolio-ci.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: portfolio-ci-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Build
        run: npm run build
